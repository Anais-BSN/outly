<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9EB"/>
      <stop offset="100%" stop-color="#E8D8C4"/>
    </radialGradient>
    <radialGradient id="spineGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8C4A3E"/>
      <stop offset="60%" stop-color="#5D0D18"/>
      <stop offset="100%" stop-color="#3A080F"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCEFD8"/>
      <stop offset="85%" stop-color="#E2CCA8"/>
      <stop offset="100%" stop-color="#CBB18B"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#C7B7A3" stroke-width="4"/>

  <!-- Spines (Back Dome with quills) -->
  <g filter="url(#softShadow)">
    <!-- Main spine shell -->
    <path d="M 50 145 C 25 125, 25 65, 85 45 C 145 25, 175 65, 170 125 C 168 140, 150 155, 125 155 Z" fill="url(#spineGrad)"/>
    
    <!-- Spine quill details / spikes -->
    <!-- Top quills -->
    <path d="M 60 55 L 50 35 L 75 48 Z" fill="#6D2932"/>
    <path d="M 80 44 L 82 22 L 98 40 Z" fill="#5D0D18"/>
    <path d="M 105 38 L 115 18 L 125 38 Z" fill="#8C4A3E"/>
    <path d="M 130 40 L 148 25 L 145 48 Z" fill="#6D2932"/>
    <path d="M 150 50 L 172 40 L 160 62 Z" fill="#5D0D18"/>
    
    <!-- Right side quills -->
    <path d="M 165 65 L 188 65 L 168 80 Z" fill="#8C4A3E"/>
    <path d="M 170 85 L 192 92 L 168 102 Z" fill="#5D0D18"/>
    <path d="M 166 108 L 188 122 L 160 126 Z" fill="#6D2932"/>
    <path d="M 158 128 L 176 145 L 148 145 Z" fill="#5D0D18"/>

    <!-- Left side quills -->
    <path d="M 45 70 L 22 62 L 42 85 Z" fill="#6D2932"/>
    <path d="M 38 88 L 15 92 L 40 105 Z" fill="#5D0D18"/>
    <path d="M 38 110 L 18 122 L 45 126 Z" fill="#8C4A3E"/>
    <path d="M 46 130 L 28 144 L 58 144 Z" fill="#5D0D18"/>

    <!-- Additional textured quills inside body -->
    <path d="M 65 75 L 55 60 L 78 70 Z" fill="#9E594D"/>
    <path d="M 90 60 L 92 42 L 105 58 Z" fill="#C47A6C"/>
    <path d="M 120 58 L 132 42 L 132 62 Z" fill="#9E594D"/>
    <path d="M 142 72 L 160 60 L 148 82 Z" fill="#C47A6C"/>
    <path d="M 148 95 L 168 90 L 150 108 Z" fill="#9E594D"/>
    <path d="M 60 95 L 42 88 L 62 108 Z" fill="#9E594D"/>
  </g>

  <!-- Cute Face and Body -->
  <path d="M 60 148 C 45 130, 48 105, 75 95 C 100 85, 125 90, 138 105 C 150 118, 148 142, 130 152 C 112 160, 75 160, 60 148 Z" fill="url(#faceGrad)" stroke="#BFA37E" stroke-width="1.5"/>

  <!-- Snout / Nose Area -->
  <path d="M 85 118 C 92 112, 108 112, 115 118 C 118 128, 105 138, 100 138 C 95 138, 82 128, 85 118 Z" fill="#F4DFC4"/>

  <!-- Little Black Nose -->
  <ellipse cx="100" cy="122" rx="7" ry="5.5" fill="#27272A"/>
  <ellipse cx="98" cy="120.5" rx="2" ry="1.5" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 96 130 Q 100 134 104 130" stroke="#5D0D18" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cute Cheeks -->
  <ellipse cx="78" cy="126" rx="6" ry="4" fill="#F0A6A6" opacity="0.6"/>
  <ellipse cx="122" cy="126" rx="6" ry="4" fill="#F0A6A6" opacity="0.6"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="84" cy="112" rx="4.5" ry="5.5" fill="#27272A"/>
  <circle cx="82.5" cy="110" r="1.8" fill="#FFFFFF"/>
  <circle cx="85.5" cy="113.5" r="0.8" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="116" cy="112" rx="4.5" ry="5.5" fill="#27272A"/>
  <circle cx="114.5" cy="110" r="1.8" fill="#FFFFFF"/>
  <circle cx="117.5" cy="113.5" r="0.8" fill="#FFFFFF"/>

  <!-- Cute Round Ears -->
  <!-- Left Ear -->
  <ellipse cx="66" cy="98" rx="8" ry="10" fill="#E2CCA8" transform="rotate(-15 66 98)"/>
  <ellipse cx="66" cy="98" rx="4.5" ry="6.5" fill="#F0A6A6" opacity="0.7" transform="rotate(-15 66 98)"/>

  <!-- Right Ear -->
  <ellipse cx="134" cy="98" rx="8" ry="10" fill="#E2CCA8" transform="rotate(15 134 98)"/>
  <ellipse cx="134" cy="98" rx="4.5" ry="6.5" fill="#F0A6A6" opacity="0.7" transform="rotate(15 134 98)"/>

  <!-- Tiny Cute Paws -->
  <ellipse cx="78" cy="155" rx="7" ry="5" fill="#E2CCA8" stroke="#BFA37E" stroke-width="1.5"/>
  <ellipse cx="122" cy="155" rx="7" ry="5" fill="#E2CCA8" stroke="#BFA37E" stroke-width="1.5"/>
</svg>
